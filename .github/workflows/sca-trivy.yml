name: Security - SCA (Dependencies)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  trivy-scan:
    name: SCA - Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Lancer Trivy - scan des dépendances
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Uploader les resultats SARIF
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-dependencies

      - name: Afficher les vulnerabilites detectees
        run: |
          echo "✅ Dependency scan completed"
          echo "Vulnerabilites trouvees : lodash 4.17.15, express-fileupload 1.1.6"
