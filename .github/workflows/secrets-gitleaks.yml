name: Security - Secrets Scanning (Gitleaks)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gitleaks:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lancer Gitleaks - scan des secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Afficher les vulnerabilites detectees
        run: |
          echo "✅ Secrets scan completed - check logs for JWT_SECRET and ADMIN_API_KEY"
