name: Security - SAST (Semgrep)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: SAST - Code Analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Lancer Semgrep (SAST)
        run: semgrep scan --config=p/security-audit --config=p/owasp-top-ten --sarif --output=semgrep.sarif || true

      - name: Uploader les resultats SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
