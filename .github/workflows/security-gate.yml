name: Security - Gate (Fail on Critical)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Lancer Semgrep et compter les CRITICAL
        run: |
          semgrep scan --config=p/security-audit --config=p/owasp-top-ten --json --output=semgrep-results.json || true

          CRITICAL_COUNT=$(python3 -c "
          import json
          try:
              with open('semgrep-results.json') as f:
                  data = json.load(f)
              results = data.get('results', [])
              critical = [r for r in results if r.get('extra', {}).get('severity') == 'ERROR']
              print(len(critical))
          except Exception as e:
              print(0)
          ")

          echo "Vulnerabilites CRITICAL trouvees: $CRITICAL_COUNT"
          echo "CRITICAL_COUNT=$CRITICAL_COUNT" >> $GITHUB_ENV

      - name: Bloquer le pipeline si CRITICAL > 0
        run: |
          if [ "$CRITICAL_COUNT" -gt "0" ]; then
            echo "❌ BUILD BLOQUE : $CRITICAL_COUNT vulnerabilite(s) CRITICAL detectee(s)"
            echo "Corrigez les failles avant de merger."
            exit 1
          else
            echo "✅ Aucune vulnerabilite CRITICAL - build autorise"
          fi
