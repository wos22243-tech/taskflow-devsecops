name: Security - DAST (OWASP ZAP)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  zap-scan:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dependances
        run: npm ci

      - name: Demarrer l'application en arriere-plan
        run: |
          node server.js &
          sleep 5
          curl -f http://localhost:3000/health

      - name: Lancer OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          cmd_options: '-a'
          allow_issue_writing: false
          artifact_name: 'zap-scan-results-${{ github.run_id }}'
          fail_action: false

      - name: Afficher le resume
        if: always()
        run: |
          echo "✅ Scan ZAP termine - voir le rapport ci-dessus"
