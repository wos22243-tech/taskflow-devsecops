<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>TaskFlow - Tache</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
  input, button, textarea { padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
  .comment { border-left: 3px solid #4a90d9; padding: 6px 10px; margin: 6px 0; background: #f9f9f9; }
</style>
</head>
<body>
  <h1>Tache #1 - Commentaires</h1>

  <textarea id="commentContent" placeholder="Ecrire un commentaire..."></textarea>
  <button onclick="postComment()">Ajouter</button>

  <div id="comments"></div>

<script>
const taskId = 1;

async function loadComments() {
  const res = await fetch(`/api/tasks/${taskId}/comments`, {
    headers: { 'Authorization': 'Bearer ' + (document.cookie.split('token=')[1] || '') }
  });
  if (!res.ok) return;
  const comments = await res.json();
  const container = document.getElementById('comments');
  container.innerHTML = '';
  comments.forEach(c => {
    const div = document.createElement('div');
    div.className = 'comment';
    // VULN (intentionnelle): innerHTML avec contenu utilisateur non echappe -> XSS stocke
    // Payload de test: <img src=x onerror=alert(document.cookie)>
    div.innerHTML = `<strong>${c.author}</strong>: ${c.content}`;
    container.appendChild(div);
  });
}

async function postComment() {
  const content = document.getElementById('commentContent').value;
  await fetch(`/api/tasks/${taskId}/comments`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + (document.cookie.split('token=')[1] || '')
    },
    body: JSON.stringify({ content })
  });
  document.getElementById('commentContent').value = '';
  loadComments();
}

loadComments();
</script>
</body>
</html>
